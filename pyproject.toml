[tool.ruff]
target-version = "py313"
extend-exclude = ["dist", ".claude", "tools/pk"]

[tool.ruff.lint]
# Correctness first; avoid a repository-wide style rewrite of binary tooling.
select = ["F", "E9"]

[tool.coverage.run]
branch = true
include = ["sdk_mods/classic_minimap/*", "sdk_mods/classic_minimap_profiler/*", "tools/build_sdkmod.py",
           "tools/land_branch.py", "tools/release_notes.py"]
data_file = "dist/ci/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.json]
output = "dist/ci/coverage.json"

[tool.coverage.xml]
output = "dist/ci/coverage.xml"

# Per-file floors prevent well-covered files from hiding regressions elsewhere.
[tool.quality.coverage."sdk_mods/classic_minimap/__init__.py"]
line = 89
branch = 84

[tool.quality.coverage."sdk_mods/classic_minimap/swfmerge.py"]
line = 97
branch = 95

[tool.quality.coverage."sdk_mods/classic_minimap_profiler/__init__.py"]
