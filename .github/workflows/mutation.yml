name: Mutation testing

# On demand only: mutation runs take over an hour, so they are not a continuous or blocking check.
# Continuous CI (ci.yml) runs lint and unit tests with coverage. See docs/CI.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -I -m pip install -r requirements-ci.txt
      - name: Run every configured mutant in isolated source copies
        run: python -B -I tools/run_mutations.py
      - name: Enforce mutation thresholds
        run: python -I tools/quality_checks.py mutation
      - name: Save mutation outcomes and surviving diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: |
            dist/ci/mutations.json
            dist/ci/mutation-survivors.json
          retention-days: 14
