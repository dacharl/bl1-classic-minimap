name: Release SDK mod

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a pre-release (proves the workflow before the first full release)
        type: boolean
        default: false
      notes:
        description: Release notes, used only when docs/release_notes/<version>.md is missing (the run fails early without either)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-sdkmod
  cancel-in-progress: false

jobs:
  main-only:
    name: Require main, a new tag and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse any other branch or tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Releases are published from main only, not $REF."
            exit 1
          fi

      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate version and source
        id: version
        shell: python -I {0}
        run: |
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          source = Path('sdk_mods/classic_minimap')
          version = tomllib.loads((source / 'pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Expected a release version in MAJOR.MINOR.PATCH format')
          tree = ast.parse((source / '__init__.py').read_text(encoding='utf-8'))
          versions = [ast.literal_eval(node.value) for node in tree.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == '__version__'
                              for target in node.targets)]
          if versions != [version]:
              raise SystemExit('__version__ and pyproject.toml version must match')
          for path in source.rglob('*.py'):
              compile(path.read_bytes(), str(path), 'exec')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
              output.write(f'tag=v{version}\n')

      - name: Require a new release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists. Bump both mod version fields before releasing."
            exit 1
          fi

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          python -I tools/release_notes.py --version "$VERSION" --notes "$NOTES" --out-dir dist
          printf '%s\n' "$TAG" > dist/release-tag.txt

      - name: Keep the notes for the release job
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            dist/release-notes.md
            dist/classic_minimap-changes.md
            dist/release-tag.txt
          if-no-files-found: error
          retention-days: 1

  checks:
    name: CI
    needs: main-only
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Fetch the release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: dist

      - name: Read the release tag
        id: version
        run: echo "tag=$(cat dist/release-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Require a new release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists. Bump both mod version fields before releasing."
            exit 1
          fi

      - name: Package mod source
        run: python -I tools/build_sdkmod.py sdk_mods/classic_minimap dist

      - name: Verify SDK mod archive
        shell: python -I {0}
        run: |
          import zipfile
          from pathlib import Path

          source = Path('sdk_mods/classic_minimap')
          expected = {f'classic_minimap/{path.relative_to(source).as_posix()}': path.read_bytes()
                      for path in source.rglob('*') if path.is_file()
                      and not {'__pycache__', '.git'} & set(path.parts)
                      and path.suffix not in {'.pyc', '.pyo'}}
          with zipfile.ZipFile('dist/classic_minimap.sdkmod') as archive:
              if archive.testzip() is not None or set(archive.namelist()) != set(expected):
                  raise SystemExit('SDK mod archive is corrupt or has unexpected entries')
              for name, data in expected.items():
                  if archive.read(name) != data:
                      raise SystemExit(f'Archive content differs from source: {name}')

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          # gh creates the tag at the tested commit, then attaches the mod and the changes supplement
          gh release create "$TAG" dist/classic_minimap.sdkmod dist/classic_minimap-changes.md \
            --target "$GITHUB_SHA" \
            --title "Classic Minimap $TAG" \
            --notes-file dist/release-notes.md \
            "${flags[@]}"
