name: Release SDK mod

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sdkmod
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate version and source
        id: version
        shell: python -I {0}
        run: |
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          source = Path('sdk_mods/classic_minimap')
          version = tomllib.loads((source / 'pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Expected a release version in MAJOR.MINOR.PATCH format')
          tree = ast.parse((source / '__init__.py').read_text(encoding='utf-8'))
          versions = [ast.literal_eval(node.value) for node in tree.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == '__version__'
                              for target in node.targets)]
          if versions != [version]:
              raise SystemExit('__version__ and pyproject.toml version must match')
          for path in source.rglob('*.py'):
              compile(path.read_bytes(), str(path), 'exec')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag=v{version}\n')

      - name: Require a new release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists. Bump both mod version fields before releasing."
            exit 1
          fi

      - name: Package mod source
        run: python -I tools/build_sdkmod.py sdk_mods/classic_minimap dist

      - name: Verify SDK mod archive
        shell: python -I {0}
        run: |
          import zipfile
          from pathlib import Path

          source = Path('sdk_mods/classic_minimap')
          expected = {f'classic_minimap/{path.relative_to(source).as_posix()}': path.read_bytes()
                      for path in source.rglob('*') if path.is_file()
                      and not {'__pycache__', '.git'} & set(path.parts)
                      and path.suffix not in {'.pyc', '.pyo'}}
          with zipfile.ZipFile('dist/classic_minimap.sdkmod') as archive:
              if archive.testzip() is not None or set(archive.namelist()) != set(expected):
                  raise SystemExit('SDK mod archive is corrupt or has unexpected entries')
              for name, data in expected.items():
                  if archive.read(name) != data:
                      raise SystemExit(f'Archive content differs from source: {name}')
          Path('dist/release-notes.md').write_text(
              'Install classic_minimap.sdkmod in your Borderlands/sdk_mods folder.\n\n'
              'Requires the willow1 PythonSDK and a locally built GfxHUD_Minimap.upk. '
              'The HUD package contains game assets and is not included in this release. '
              'See README.md and docs/PROGRESS.md at the release tag for build instructions.\n',
              encoding='utf-8')

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/classic_minimap.sdkmod \
            --target "$GITHUB_SHA" \
            --title "Classic Minimap $TAG" \
            --notes-file dist/release-notes.md
