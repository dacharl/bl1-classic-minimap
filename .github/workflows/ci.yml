name: CI

on:
  push:
    branches: [main]
    paths:   # skip docs-only pushes; filtering a PR event would leave required checks pending
      - '**'
      - '!docs/**'
      - '!*.md'
      - 'docs/research/PERF_REPORT_V1.md'     # bump_version edits these two, and the tests read them
      - 'docs/plans/PLAN_V11_MCP_HANDOFF.md'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:   # the release workflow runs these same checks before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -I -m pip install -r requirements-ci.txt
      - run: python -I -m pip check
      - run: python -I -m ruff check sdk_mods tools
      - run: python -I tools/quality_checks.py repository
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo
          rhysd/actionlint:1.7.12 -color

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # the game's OS and the PythonSDK's interpreter (python314.dll)
            python: '3.14'
          - os: ubuntu-latest    # the local tools' Python, and POSIX process groups for the mutation runner
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
      # The whole installed environment is cached, not just pip's downloads: installing the ~30 packages took
      # 17 s on Windows (PHASE3 3by). The key holds the exact interpreter and the pinned requirements.
      - name: Restore the CI tools environment
        id: venv
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ci-venv
          key: ci-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-ci.txt') }}
      - name: Install the CI tools
        if: steps.venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -I -m venv "$RUNNER_TEMP/ci-venv"
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/ci-venv/Scripts"; else bin="$RUNNER_TEMP/ci-venv/bin"; fi
          "$bin/python" -I -m pip install -r requirements-ci.txt
          "$bin/python" -I -m pip check
      - name: Use the CI tools environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/ci-venv/Scripts"; else bin="$RUNNER_TEMP/ci-venv/bin"; fi
          echo "$bin" >> "$GITHUB_PATH"
      # pip check runs when the venv is built; a restored venv is the same bytes (3 s on Windows, PHASE3 3by).
      - name: Check that python is the CI tools environment
        run: python -I -c "import sys; assert sys.prefix != sys.base_prefix, 'not the CI venv: ' + sys.prefix"
      - name: Run unit tests with automatic workers and combined branch coverage
        run: python -B -I tools/run_tests.py --coverage --durations 5
      - run: python -I -m coverage report
      - run: python -I -m coverage json
      - run: python -I -m coverage xml
      - name: Enforce per-file line and branch thresholds
        run: python -I tools/quality_checks.py coverage
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/ci/coverage.json
            dist/ci/coverage.xml
          retention-days: 14
